name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check Conventional Commits format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must follow Conventional Commits, for example: feat(catalog): add search"
            exit 1
          fi

  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - name: Dependency audit (fails on high or critical)
        run: npm audit --audit-level=high
      - name: Registry signatures of installed packages
        run: npm audit signatures
      - name: Direct dependencies active in the last 12 months (NFR-SEC-18)
        run: npm run check:maintained

  database:
    name: Database tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start local Supabase (migrations and seed applied from scratch)
        run: npx supabase start -x studio,imgproxy,mailpit,logflare,vector,edge-runtime,supavisor,postgres-meta
      - name: Database tests (pgTAP)
        run: npx supabase test db --local
      - name: Lint database functions
        run: npx supabase db lint --local --schema public --level warning --fail-on warning

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Logins for the throwaway local stack only, created by scripts/create-local-staff.mjs.
    env:
      E2E_STAFF_EMAIL: staff@example.test
      E2E_STAFF_PASSWORD: Ci-Staff-Login-1
      E2E_NOT_STAFF_EMAIL: visitor@example.test
      E2E_NOT_STAFF_PASSWORD: Ci-Visitor-Login-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # A throwaway local stack with the seed data, so e2e/live-stack.spec.ts can prove RLS and
      # live updates for real. The other tests answer Supabase requests themselves.
      # The contact function's settings for this throwaway stack, with a fresh random salt.
      - name: Settings for the local contact function
        run: |
          printf 'ALLOWED_ORIGINS=http://127.0.0.1:4173\nCONTACT_IP_SALT=%s\n' "$(openssl rand -hex 32)" > supabase/functions/.env
      - name: Start local Supabase, with Edge Functions
        run: npx supabase start -x studio,imgproxy,mailpit,logflare,vector,supavisor,postgres-meta
      - name: Pass the local stack's settings to the build and tests
        run: |
          npx supabase status -o env > "$RUNNER_TEMP/supabase.env"
          value() { sed -n "s/^$1=\"\{0,1\}\([^\"]*\)\"\{0,1\}$/\1/p" "$RUNNER_TEMP/supabase.env"; }
          api_url="$(value API_URL)"
          anon_key="$(value ANON_KEY)"
          service_key="$(value SERVICE_ROLE_KEY)"
          if [ -z "$api_url" ] || [ -z "$anon_key" ] || [ -z "$service_key" ]; then
            echo "::error::supabase status did not print API_URL, ANON_KEY and SERVICE_ROLE_KEY"
            exit 1
          fi
          echo "::add-mask::$service_key"
          {
            echo "VITE_SUPABASE_URL=$api_url"
            echo "VITE_SUPABASE_ANON_KEY=$anon_key"
            echo "E2E_SERVICE_ROLE_KEY=$service_key"
            echo "E2E_LIVE_SUPABASE=1"
          } >> "$GITHUB_ENV"
      - name: Check that the contact function answers
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: http://127.0.0.1:4173' "$VITE_SUPABASE_URL/functions/v1/contact")
            if [ "$status" = "204" ]; then exit 0; fi
            sleep 2
          done
          echo "::error::The contact function did not answer its preflight (last status $status)"
          exit 1
      - name: Create a staff login and a non-staff login on the local stack (D-028)
        env:
          API_URL: ${{ env.VITE_SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ env.E2E_SERVICE_ROLE_KEY }}
        run: |
          node scripts/create-local-staff.mjs "$E2E_STAFF_EMAIL" "$E2E_STAFF_PASSWORD"
          node scripts/create-local-staff.mjs "$E2E_NOT_STAFF_EMAIL" "$E2E_NOT_STAFF_PASSWORD" --not-staff
      - run: npm run build:e2e
      # The local stack's service role key and the function's salt are set here, so this
      # proves the build holds neither (NFR-SEC-06).
      - run: npm run check:bundle
      - run: npm run test:e2e
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
